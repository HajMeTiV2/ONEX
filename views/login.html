<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ONEX • Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.25s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 100px;
      position: relative;
      background: radial-gradient(circle at 50% 10%, #0d2847 0%, #061528 50%, #020712 100%);
      color: #f1f5f9;
      overflow-x: hidden;
    }

    /* کارت ورود شیشه‌ای منطبق با تصویر */
    .login-container {
      width: 100%;
      max-width: 380px;
      background: rgba(10, 22, 40, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(2, 132, 199, 0.15);
      border-radius: 28px;
      padding: 28px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(20px);
      z-index: 10;
    }

    /* دایره لوگوی اصلی ONEX */
    .brand-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle, #0284c7 0%, #032b4d 65%, #021324 100%);
      border: 2px solid rgba(56, 189, 248, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.3);
      margin-bottom: 14px;
      position: relative;
    }

    .brand-circle svg {
      width: 78px;
      height: 78px;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
    }

    .login-title {
      font-size: 23px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 4px;
      text-shadow: 0 2px 12px rgba(56, 189, 248, 0.35);
    }

    .login-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 22px;
      text-align: center;
    }

    form {
      width: 100%;
    }

    .field-wrap {
      width: 100%;
      margin-bottom: 15px;
      text-align: inherit;
    }

    .field-label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
      padding: 0 4px;
    }

    .input-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(6, 15, 29, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 14px;
      padding: 0 14px;
      height: 48px;
    }

    .input-box:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
    }

    .input-box input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 13px;
      text-align: inherit;
    }

    .input-box i {
      color: #64748b;
      font-size: 15px;
    }

    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .eye-btn:hover {
      color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.55);
    }

    .card-footer-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .icon-pill {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(6, 15, 29, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: pointer;
    }
    .icon-pill:hover {
      color: #38bdf8;
      border-color: #38bdf8;
    }

    .lang-switcher {
      display: flex;
      background: rgba(6, 15, 29, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .lang-tab {
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .lang-tab.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.5);
    }

    /* نوار مدرن و اختصاصی پایین صفحه */
    .pro-footer-dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      max-width: 95%;
    }

    /* نوار اختصاصی سازنده */
    .creator-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(8, 20, 36, 0.94), rgba(4, 12, 24, 0.96));
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .creator-badge {
      font-size: 9px;
      font-weight: 800;
      color: #0284c7;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .creator-name {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      text-decoration: none;
    }

    /* نوار اختصاصی کانال تلگرام */
    .channel-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.18), rgba(8, 28, 52, 0.94));
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.25);
      backdrop-filter: blur(12px);
      text-decoration: none;
    }

    .channel-pill:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: blinker 1.5s infinite;
    }

    .channel-text {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    /* لوگوی سه‌بعدی و براق تلگرام */
    .tg-3d-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #0284c7 60%, #034b8c 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.55), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      text-decoration: none;
      position: relative;
      flex-shrink: 0;
      animation: pulse-glow 2.5s infinite;
    }

    .tg-3d-btn svg {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.65); }
      70% { box-shadow: 0 0 0 11px rgba(14, 165, 233, 0); }
      100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
    }

    @keyframes blinker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 420px) {
      .pro-footer-dock {
        flex-direction: row;
        gap: 6px;
      }
      .creator-pill, .channel-pill {
        padding: 5px 9px;
      }
      .creator-name, .channel-text {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- دایره لوگوی اختصاصی ONEX -->
    <div class="brand-circle">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
          </linearGradient>
          <linearGradient id="glowBolt" x1="0%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>
        </defs>
        
        <circle cx="50" cy="50" r="44" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>
        <circle cx="50" cy="50" r="39" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
        
        <circle cx="50" cy="7" r="2.5" fill="#38bdf8"/>
        <circle cx="93" cy="50" r="2.5" fill="#38bdf8"/>
        <circle cx="50" cy="93" r="2.5" fill="#38bdf8"/>
        <circle cx="7" cy="50" r="2.5" fill="#38bdf8"/>

        <path d="M53 18 L34 50 L48 50 L43 78 L65 44 L51 44 Z" fill="url(#glowBolt)"/>
        <text x="50" y="88" font-size="10.5" font-weight="900" fill="#e0f2fe" text-anchor="middle" letter-spacing="2" font-family="sans-serif">ONEX</text>
      </svg>
    </div>

    <h2 class="login-title" id="txtTitle">ورود به پنل</h2>
    <p class="login-subtitle" id="txtSubtitle">با نام کاربری و رمز عبور خود وارد شوید</p>

    <form id="loginForm">
      <div class="field-wrap">
        <label class="field-label" id="lblUser">نام کاربری</label>
        <div class="input-box">
          <input type="text" id="uName" placeholder="admin" required autocomplete="username">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>

      <div class="field-wrap">
        <label class="field-label" id="lblPass">رمز عبور</label>
        <div class="input-box">
          <button type="button" class="eye-btn" onclick="togglePass()">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
          <input type="password" id="uPass" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-key"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span id="txtBtn">ورود</span>
      </button>
    </form>

    <div class="card-footer-controls">
      <div class="icon-pill" title="تنظیمات تم" onclick="toggleMode()">
        <i class="fa-solid fa-gear" id="gearIcon"></i>
      </div>

      <div class="lang-switcher">
        <button type="button" class="lang-tab" id="btnEn" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-tab active" id="btnFa" onclick="setLang('fa')">FA</button>
      </div>
    </div>

  </div>

  <!-- نوار پایینی بازطراحی‌شده با لوگوی سه‌بعدی و نوارهای حرفه‌ای -->
  <div class="pro-footer-dock">
    
    <!-- نوار سازنده -->
    <div class="creator-pill">
      <span class="creator-badge">CREATOR</span>
      <span class="creator-name">@Mehtif</span>
    </div>

    <!-- نوار کانال با نشانگر زنده -->
    <a href="https://t.me/V2rayTun0" target="_blank" class="channel-pill" title="پیوستن به کانال">
      <span class="pulse-dot"></span>
      <span class="channel-text">@V2rayTun0</span>
    </a>

    <!-- دکمه سه‌بعدی وکتور تلگرام -->
    <a href="https://t.me/V2rayTun0" target="_blank" class="tg-3d-btn" title="کانال رسمی @V2rayTun0">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.6 3.6L2.8 10.9C1.5 11.4 1.5 12.2 2.6 12.5L7.4 14L18.6 6.9C19.1 6.6 19.6 6.8 19.2 7.1L10.1 15.3H10.1L9.8 19.7C10.2 19.7 10.4 19.5 10.7 19.2L12.8 17.2L17.2 20.4C18 20.9 18.6 20.6 18.8 19.6L21.7 5.8C22 4.6 21.2 4 21.6 3.6Z" fill="#ffffff"/>
      </svg>
    </a>

  </div>

  <script>
    const i18n = {
      fa: {
        title: "ورود به پنل",
        subtitle: "با نام کاربری و رمز عبور خود وارد شوید",
        userLabel: "نام کاربری",
        passLabel: "رمز عبور",
        btn: "ورود",
        dir: "rtl"
      },
      en: {
        title: "Panel Login",
        subtitle: "Enter your username and password",
        userLabel: "Username",
        passLabel: "Password",
        btn: "Login",
        dir: "ltr"
      }
    };

    let currentLang = 'fa';

    function setLang(lang) {
      currentLang = lang;
      const data = i18n[lang];
      document.documentElement.setAttribute('dir', data.dir);
      document.documentElement.setAttribute('lang', lang);

      document.getElementById('txtTitle').innerText = data.title;
      document.getElementById('txtSubtitle').innerText = data.subtitle;
      document.getElementById('lblUser').innerText = data.userLabel;
      document.getElementById('lblPass').innerText = data.passLabel;
      document.getElementById('txtBtn').innerText = data.btn;

      if (lang === 'fa') {
        document.getElementById('btnFa').classList.add('active');
        document.getElementById('btnEn').classList.remove('active');
      } else {
        document.getElementById('btnEn').classList.add('active');
        document.getElementById('btnFa').classList.remove('active');
      }
    }

    function togglePass() {
      const passIn = document.getElementById('uPass');
      const eye = document.getElementById('eyeIcon');
      if (passIn.type === 'password') {
        passIn.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        passIn.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    let isDark = true;
    function toggleMode() {
      isDark = !isDark;
      if (!isDark) {
        document.body.style.background = 'radial-gradient(circle at 50% 10%, #1e40af 0%, #0369a1 50%, #021f3f 100%)';
      } else {
        document.body.style.background = 'radial-gradient(circle at 50% 10%, #0d2847 0%, #061528 50%, #020712 100%)';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('uName').value,
            password: document.getElementById('uPass').value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          alert(data.error || (currentLang === 'fa' ? 'اطلاعات ورود اشتباه است' : 'Invalid credentials'));
        }
      } catch (err) {
        alert(currentLang === 'fa' ? 'خطا در برقراری ارتباط با سرور' : 'Server connection error');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
