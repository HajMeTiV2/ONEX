
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEX | پنل مدیریت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>body { font-family: 'Vazirmatn', sans-serif; } .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }</style>
</head>
<body class="bg-[#040711] min-h-screen text-slate-100 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">

    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-black text-white">ON<span class="text-cyan-400">EX</span> Admin</h1>
        <span class="text-xs text-slate-500">سازنده: @Mehtif</span>
      </div>
      <a href="/login" class="text-xs text-slate-400 hover:text-cyan-400">← خروج</a>
    </div>

    <div class="glass rounded-3xl p-6">
      <h2 class="text-sm font-bold text-white mb-4">➕ ایجاد اشتراک جدید</h2>
      <form id="createForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input id="uName" placeholder="نام کاربری" required class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        <input id="uPass" placeholder="رمز عبور" required class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        <input id="uTraffic" type="number" placeholder="حجم (GB)" value="50" required class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        <input id="uExpire" placeholder="تاریخ انقضا (1404/05/20)" value="1404/05/20" required class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none">
        <button type="submit" class="md:col-span-2 bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold py-3 rounded-xl text-xs cursor-pointer">
          ساخت کاربر
        </button>
      </form>
    </div>

    <div class="glass rounded-3xl p-6">
      <h2 class="text-sm font-bold text-white mb-4">👥 کاربران ثبت‌شده</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-right">
          <thead>
            <tr class="text-slate-400 border-b border-slate-800">
              <th class="py-2.5 px-3">نام کاربری</th>
              <th class="py-2.5 px-3">ترافیک</th>
              <th class="py-2.5 px-3">تاریخ انقضاء</th>
              <th class="py-2.5 px-3">وضعیت</th>
              <th class="py-2.5 px-3">داشبورد</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    async function load() {
      const users = await fetch('/api/admin/users').then(r => r.json());
      document.getElementById('userTableBody').innerHTML = users.map(u => `
        <tr class="border-b border-slate-800/40">
          <td class="py-3 px-3 font-bold text-white">${u.username}</td>
          <td class="py-3 px-3 text-slate-300">${u.used_traffic_gb} / ${u.total_traffic_gb} GB</td>
          <td class="py-3 px-3 text-slate-300">${u.expire_date}</td>
          <td class="py-3 px-3"><span class="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">فعال</span></td>
          <td class="py-3 px-3"><a href="/dashboard/${u.id}" target="_blank" class="text-cyan-400 hover:underline">باز کردن داشبورد ↗</a></td>
        </tr>
      `).join('');
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/admin/create-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('uName').value,
          password: document.getElementById('uPass').value,
          totalTrafficGB: parseFloat(document.getElementById('uTraffic').value),
          expireDate: document.getElementById('uExpire').value
        })
      });
      alert('کاربر ایجاد شد!');
      load();
    });

    load();
  </script>
</body>
</html>
