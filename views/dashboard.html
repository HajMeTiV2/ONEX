<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد ابری ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #050711;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px 14px;
      position: relative;
    }
    .ambient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.1), transparent 50%);
      z-index: -1; pointer-events: none;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* نوار هدر */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
    }
    .brand-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .badge-creator { font-size: 12px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 4px 10px; border-radius: 8px; }
    
    /* کارت‌های وضعیت */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-item {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px; padding: 18px;
    }
    .stat-label { font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
    .stat-val { font-size: 26px; font-weight: 800; margin-top: 6px; color: #fff; }

    /* دکمه‌ها */
    .btn {
      padding: 10px 18px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-action { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* کارت‌های کانفیگ برای موبایل */
    .user-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .user-info h4 { font-size: 16px; font-weight: 700; color: #f8fafc; }
    .user-info span { font-size: 12px; color: #94a3b8; margin-left: 10px; }

    /* مودال شیشه‌ای */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-card {
      width: 90%; max-width: 440px; background: #0c1222; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 25px;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="container">
    
    <!-- هدر بالا -->
    <div class="glass-panel topbar">
      <div>
        <div class="brand-title">
          <i class="fa-solid fa-cube text-primary" style="color: #38bdf8;"></i> ONEX Panel
          <span class="badge-creator">@Mehtif</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> ساخت کانفیگ</button>
        <a href="/logout" class="btn btn-danger"><i class="fa-solid fa-power-off"></i></a>
      </div>
    </div>

    <!-- آمار کلیدی -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label"><i class="fa-solid fa-users text-info"></i> مجموع کاربران</div>
        <div class="stat-val" id="total-users">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label"><i class="fa-solid fa-hard-drive text-primary" style="color: #38bdf8;"></i> حجم اختصاصی</div>
        <div class="stat-val" id="total-traffic">0 GB</div>
      </div>
      <div class="stat-item">
        <div class="stat-label"><i class="fa-brands fa-telegram text-info"></i> پشتیبانی کانال</div>
        <div class="stat-val"><a href="https://t.me/V2rayTunp" target="_blank" style="color: #38bdf8; font-size: 17px; text-decoration: none;">@V2rayTunp</a></div>
      </div>
    </div>

    <!-- لیست کاربران و کانفیگ‌ها -->
    <div class="glass-panel">
      <h3 style="font-size: 16px; margin-bottom: 16px; color: #94a3b8;"><i class="fa-solid fa-list-check me-2"></i> اشتراک‌های فعال</h3>
      <div id="userList"></div>
    </div>
  </div>

  <!-- مودال شیشه‌ای ثبت کانفیگ -->
  <div class="modal-overlay" id="createModal">
    <div class="modal-card">
      <h3 style="margin-bottom: 16px; font-size: 18px;">ساخت کانفیگ جدید</h3>
      <form id="createForm">
        <input type="text" id="cfg-name" placeholder="نام کاربر (انگلیسی)" style="width: 100%; padding: 12px; background: #162032; border: 1px solid #233554; border-radius: 10px; color: #fff; margin-bottom: 12px;" required>
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
          <input type="number" id="cfg-gb" placeholder="حجم (GB)" value="30" style="width: 50%; padding: 12px; background: #162032; border: 1px solid #233554; border-radius: 10px; color: #fff;" required>
          <input type="number" id="cfg-days" placeholder="اعتبار (روز)" value="30" style="width: 50%; padding: 12px; background: #162032; border: 1px solid #233554; border-radius: 10px; color: #fff;" required>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">ایجاد کانفیگ</button>
          <button type="button" class="btn btn-danger" onclick="closeModal()">لغو</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openModal() { document.getElementById('createModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('createModal').style.display = 'none'; }

    async function loadData() {
      const s = await fetch('/api/stats').then(r => r.json());
      document.getElementById('total-users').innerText = s.totalUsers;
      document.getElementById('total-traffic').innerText = s.totalAllocatedGb + ' GB';

      const users = await fetch('/api/users').then(r => r.json());
      const container = document.getElementById('userList');
      const host = window.location.host;

      if(users.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">هیچ کانفیگی ایجاد نشده است.</div>';
        return;
      }

      container.innerHTML = users.map(u => `
        <div class="user-card">
          <div class="user-info">
            <h4>${u.username}</h4>
            <span><i class="fa-solid fa-database"></i> ${u.total_gb} GB</span>
            <span><i class="fa-regular fa-clock"></i> ${u.expire_days} روز</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-primary btn-action" onclick="navigator.clipboard.writeText('https://${host}/sub/${u.id}'); alert('لینک ساب‌اسکریپشن کپی شد!');">
              <i class="fa-solid fa-copy"></i> کپی ساب
            </button>
            <a href="/subpage/${u.id}" target="_blank" class="btn btn-action" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> صفحه کلاینت
            </a>
            <button class="btn btn-danger btn-action" onclick="deleteUser('${u.id}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('cfg-name').value,
          total_gb: document.getElementById('cfg-gb').value,
          expire_days: document.getElementById('cfg-days').value
        })
      });
      closeModal();
      loadData();
    });

    async function deleteUser(id) {
      if(confirm('حذف شود؟')) {
        await fetch('/api/users/' + id, { method: 'DELETE' });
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
