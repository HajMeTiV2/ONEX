<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد مدیریت حرفه‌ای ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, sans-serif; }
    .glass-box { background: #111827; border: 1px solid #1f2937; border-radius: 14px; }
    .stat-card { border-left: 4px solid #0284c7; }
  </style>
</head>
<body class="p-3 p-md-4">
  <div class="container-fluid" style="max-width: 1200px;">
    
    <!-- نوار بالا -->
    <div class="glass-box p-3 mb-4 d-flex flex-wrap justify-content-between align-items-center">
      <div>
        <h4 class="fw-bold mb-0 text-white"><i class="fa-solid fa-server text-info me-2"></i>سامانه ابری ONEX</h4>
        <small class="text-secondary">سازنده: <b class="text-light">@Mehtif</b> | کانال: <a href="https://t.me/V2rayTunp" class="text-info text-decoration-none">@V2rayTunp</a></small>
      </div>
      <div class="mt-2 mt-md-0">
        <button class="btn btn-outline-primary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#createModal">
          <i class="fa-solid fa-plus me-1"></i> ساخت کانفیگ جدید
        </button>
        <a href="/logout" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket"></i> خروج</a>
      </div>
    </div>

    <!-- آمار کلیدی -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="glass-box stat-card p-3">
          <span class="text-secondary small">تعداد کل کانفیگ‌ها</span>
          <h2 id="total-users" class="fw-bold text-white mb-0 mt-1">0</h2>
        </div>
      </div>
      <div class="col-md-6">
        <div class="glass-box stat-card p-3" style="border-left-color: #10b981;">
          <span class="text-secondary small">کل ترافیک تخصیص‌یافته</span>
          <h2 id="total-traffic" class="fw-bold text-success mb-0 mt-1">0 GB</h2>
        </div>
      </div>
    </div>

    <!-- جدول کاربران -->
    <div class="glass-box p-3">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-users me-2 text-secondary"></i>لیست کانفیگ‌های صادرشده</h5>
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr class="text-secondary">
              <th>شناسه و نام کاربر</th>
              <th>سقف حجم</th>
              <th>مدت اعتبار</th>
              <th>لینک سریع ساب</th>
              <th>صفحه کاربر</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="userList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- مودال ساخت کاربر جدید -->
  <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">ساخت کانفیگ اختصاصی جدید</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="createForm">
            <div class="mb-3">
              <label class="form-label text-secondary small">نام کاربر یا ریمارک کانفیگ</label>
              <input type="text" id="cfg-name" class="form-control bg-black text-white border-secondary" placeholder="مثال: Ali-Office" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col">
                <label class="form-label text-secondary small">حجم (گیگابایت)</label>
                <input type="number" id="cfg-gb" class="form-control bg-black text-white border-secondary" value="30" required>
              </div>
              <div class="col">
                <label class="form-label text-secondary small">مدت زمان (روز)</label>
                <input type="number" id="cfg-days" class="form-control bg-black text-white border-secondary" value="30" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">تولید و ثبت آنی</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadData() {
      const s = await fetch('/api/stats').then(r => r.json());
      document.getElementById('total-users').innerText = s.totalUsers;
      document.getElementById('total-traffic').innerText = s.totalAllocatedGb + ' GB';

      const users = await fetch('/api/users').then(r => r.json());
      const tbody = document.getElementById('userList');
      const host = window.location.host;

      tbody.innerHTML = users.map(u => `
        <tr>
          <td><i class="fa-solid fa-circle-user text-info me-2"></i><b>${u.username}</b></td>
          <td><span class="badge bg-secondary">${u.total_gb} GB</span></td>
          <td>${u.expire_days} روز</td>
          <td>
            <button class="btn btn-sm btn-outline-info" onclick="navigator.clipboard.writeText('https://${host}/sub/${u.id}'); alert('لینک ساب کپی شد!');">
              <i class="fa-solid fa-copy"></i> کپی
            </button>
          </td>
          <td>
            <a href="/subpage/${u.id}" target="_blank" class="btn btn-sm btn-success">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> صفحه اختصاصی
            </a>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${u.id}')">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('cfg-name').value,
          total_gb: document.getElementById('cfg-gb').value,
          expire_days: document.getElementById('cfg-days').value
        })
      });
      location.reload();
    });

    async function deleteUser(id) {
      if(confirm('آیا از حذف این کاربر مطمئن هستید؟')) {
        await fetch('/api/users/' + id, { method: 'DELETE' });
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
