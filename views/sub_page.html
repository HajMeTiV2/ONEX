
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>کانفیگ‌های اختصاصی - ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b1120; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .box { background-color: #1e293b; border: 1px solid #334155; border-radius: 14px; }
    .btn-copy { min-width: 90px; }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 680px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-info">ONEX Service</h2>
      <p class="text-secondary mb-1">طراحی شده توسط @Mehtif</p>
      <a href="https://t.me/V2rayTunp" class="badge bg-primary text-decoration-none px-3 py-2 mt-2">عضویت در کانال @V2rayTunp</a>
    </div>

    <!-- خلاصه وضعیت کاربر -->
    <div class="box p-4 mb-4 text-center">
      <h4 id="u-name" class="fw-bold mb-2">در حال بارگذاری...</h4>
      <p class="mb-0 text-light">حجم کل: <span id="u-gb" class="badge bg-success">0 GB</span></p>
    </div>

    <!-- کپی لینک مستقیم ساب -->
    <div class="box p-3 mb-4">
      <label class="form-label text-warning fw-bold">لینک ساب‌اسکریپشن اتوماتیک:</label>
      <div class="input-group">
        <input type="text" id="sub-input" class="form-control bg-dark text-white border-secondary" readonly>
        <button class="btn btn-warning btn-copy" onclick="copyField('sub-input')">کپی ساب</button>
      </div>
    </div>

    <!-- کپی تک‌تک پروتکل‌ها -->
    <div class="box p-4">
      <h5 class="mb-3 text-secondary">پروتکل‌های موجود:</h5>

      <div class="mb-3">
        <label class="form-label text-light">پروتکل VLESS:</label>
        <div class="input-group">
          <input type="text" id="vless-txt" class="form-control bg-dark text-white border-secondary" readonly>
          <button class="btn btn-outline-info btn-copy" onclick="copyField('vless-txt')">کپی</button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-light">پروتکل VMess:</label>
        <div class="input-group">
          <input type="text" id="vmess-txt" class="form-control bg-dark text-white border-secondary" readonly>
          <button class="btn btn-outline-info btn-copy" onclick="copyField('vmess-txt')">کپی</button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-light">پروتکل Trojan:</label>
        <div class="input-group">
          <input type="text" id="trojan-txt" class="form-control bg-dark text-white border-secondary" readonly>
          <button class="btn btn-outline-info btn-copy" onclick="copyField('trojan-txt')">کپی</button>
        </div>
      </div>

      <div>
        <label class="form-label text-light">پروتکل Shadowsocks:</label>
        <div class="input-group">
          <input type="text" id="ss-txt" class="form-control bg-dark text-white border-secondary" readonly>
          <button class="btn btn-outline-info btn-copy" onclick="copyField('ss-txt')">کپی</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const id = window.location.pathname.split('/').pop();
    fetch('/api/subinfo/' + id)
      .then(res => res.json())
      .then(data => {
        document.getElementById('u-name').innerText = 'کاربر: ' + data.user.username;
        document.getElementById('u-gb').innerText = data.user.total_gb + ' GB';
        document.getElementById('sub-input').value = data.subUrl;
        document.getElementById('vless-txt').value = data.configs.vlessUri;
        document.getElementById('vmess-txt').value = data.configs.vmessUri;
        document.getElementById('trojan-txt').value = data.configs.trojanUri;
        document.getElementById('ss-txt').value = data.configs.ssUri;
      });

    function copyField(elementId) {
      const copyText = document.getElementById(elementId);
      navigator.clipboard.writeText(copyText.value);
      alert('کپی شد!');
    }
  </script>
</body>
</html>
