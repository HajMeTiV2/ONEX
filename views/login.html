
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(3, 7, 18) 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
    }
  </style>
</head>
<body>
  <div class="login-card p-4 text-white">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle p-3 mb-2">
        <i class="fa-solid fa-shield-halved fa-2x"></i>
      </div>
      <h3 class="fw-bold tracking-wide">ONEX Core</h3>
      <p class="text-secondary small">ورود به پنل ادمین | ساخته شده توسط <span class="text-info">@Mehtif</span></p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label text-secondary small">نام کاربری</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
          <input type="text" id="username" class="form-control bg-dark text-white border-secondary" placeholder="admin" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small">رمز عبور</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-gradient text-white w-100 py-2 fw-bold">ورود به پنل</button>
    </form>
    
    <div class="text-center mt-3">
      <a href="https://t.me/V2rayTunp" target="_blank" class="text-secondary small text-decoration-none">
        <i class="fa-brands fa-telegram text-info me-1"></i> کانال تلگرام: @V2rayTunp
      </a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if(data.success) {
        window.location.href = '/';
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
