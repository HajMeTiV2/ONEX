<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    font-family:"Vazirmatn",Tahoma,sans-serif;
}

:root{
    --blue:#08aaff;
    --blue2:#007cff;
    --cyan:#38d9ff;
    --dark:#020914;
    --panel:rgba(3,18,38,.78);
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px 35px;
    color:#fff;
    overflow-x:hidden;
    position:relative;
    background:
        linear-gradient(
            to bottom,
            rgba(0,9,23,.30),
            rgba(1,8,20,.70) 52%,
            rgba(0,3,10,.98)
        ),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?q=85&w=1800&auto=format&fit=crop")
        center center / cover fixed no-repeat;
}

/* لایه تاریک سینمایی */
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(0,174,255,.28),
            transparent 28%
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.38),
            transparent 50%,
            rgba(0,0,0,.38)
        );
    z-index:0;
}

/* ذرات نور */
body:after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.45;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px);
    background-size:130px 130px;
    animation:stars 12s linear infinite;
    z-index:1;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(130px)}
}

/* =========================================
   MAIN
========================================= */

.page{
    width:100%;
    max-width:430px;
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================================
   3D LOGO
========================================= */

.logo-area{
    width:100%;
    height:205px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.logo-glow{
    position:absolute;
    width:220px;
    height:170px;
    top:12px;
    border-radius:50%;
    background:radial-gradient(
        ellipse,
        rgba(0,179,255,.42),
        rgba(0,95,255,.15) 45%,
        transparent 72%
    );
    filter:blur(22px);
    animation:glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        transform:scale(.90);
        opacity:.65;
    }
    to{
        transform:scale(1.08);
        opacity:1;
    }
}

.logo-orbit{
    position:absolute;
    width:210px;
    height:78px;
    border:3px solid rgba(28,190,255,.9);
    border-radius:50%;
    transform:rotate(-17deg) rotateX(63deg);
    box-shadow:
        0 0 10px #00bfff,
        0 0 25px rgba(0,174,255,.8),
        inset 0 0 10px rgba(0,174,255,.5);
    animation:orbit 7s linear infinite;
}
