<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEX v3 | ورود</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>body{font-family:'Vazirmatn',sans-serif}.glass{background:rgba(15,23,42,.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}</style>
</head>
<body class="bg-[#040711] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-6">
    <svg class="w-20 h-20 mx-auto mb-3" viewBox="0 0 100 100" fill="none">
      <defs><linearGradient id="g" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
      <rect x="6" y="6" width="88" height="88" rx="26" fill="#0b1120" stroke="url(#g)" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="26" stroke="url(#g)" stroke-width="4.5" stroke-dasharray="115 35"/>
      <path d="M39 39L61 61M61 39L39 61" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <h1 class="text-3xl font-black text-white">ON<span class="text-cyan-400">EX</span></h1>
    <p class="text-xs text-slate-400 mt-1">پنل مدیریت چند سطحی V2Ray</p>
    <span class="inline-block mt-2 text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full">نسخه ۳ حرفه‌ای</span>
  </div>
  <div class="glass rounded-3xl p-7">
    <h2 class="text-base font-bold text-white mb-4">ورود به پنل مدیریت</h2>
    <form id="lf" class="space-y-3">
      <input type="text" id="u" value="admin" placeholder="نام کاربری" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-cyan-500">
      <input type="password" id="p" value="admin123" placeholder="رمز" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-cyan-500">
      <div id="er" class="hidden text-xs text-rose-400 bg-rose-500/10 rounded-xl p-3"></div>
      <button class="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 text-white font-bold py-3.5 rounded-xl">ورود</button>
    </form>
    <a href="https://t.me/V2rayTun0" target="_blank" class="mt-5 flex justify-center gap-2 w-full bg-slate-900 border border-slate-800 py-3 rounded-2xl text-xs text-slate-300">📢 <span class="font-bold text-[#0088cc]">@V2rayTun0</span></a>
  </div>
  <p class="text-center mt-5 text-[11px] text-slate-500">توسعه‌دهنده: <a href="https://t.me/Mehtif" class="text-cyan-400 font-bold" target="_blank">@Mehtif</a></p>
</div>
<script>
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const er = document.getElementById('er');
  er.classList.add('hidden');
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username: u.value.trim(), password: p.value})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    localStorage.setItem('onex_token', d.token);
    localStorage.setItem('onex_admin', JSON.stringify(d.admin));
    location.href = '/dashboard';
  } catch(err) { er.textContent = err.message; er.classList.remove('hidden'); }
});
</script>
</body>
</html>
