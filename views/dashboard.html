
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد مدیریت ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .table-dark { background-color: #1e293b; }
    .badge-telegram { background-color: #0ea5e9; color: white; text-decoration: none; padding: 6px 12px; border-radius: 20px; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <div>
        <h2 class="fw-bold mb-0">⚡ پنل مدیریت ONEX</h2>
        <small class="text-secondary">سازنده: <span class="text-info">@Mehtif</span></small>
      </div>
      <div>
        <a href="https://t.me/V2rayTunp" target="_blank" class="badge-telegram">عضویت در کانال @V2rayTunp</a>
      </div>
    </div>

    <!-- فرم افزودن کاربر -->
    <div class="card p-4 mb-4">
      <h5 class="card-title mb-3">افزودن کانفیگ / کاربر جدید</h5>
      <form action="/api/users" method="POST" class="row g-3">
        <div class="col-md-5">
          <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="نام کاربر یا ریمارک" required>
        </div>
        <div class="col-md-4">
          <input type="number" name="total_gb" class="form-control bg-dark text-light border-secondary" placeholder="حجم (گیگابایت)" value="30" required>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-primary w-100 fw-bold">ایجاد کانفیگ</button>
        </div>
      </form>
    </div>

    <!-- جدول کاربران -->
    <div class="card p-3">
      <h5 class="card-title mb-3">لیست کاربران و ساب‌ها</h5>
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>نام</th>
              <th>حجم مجاز</th>
              <th>لینک ساب کلاینت</th>
              <th>صفحه وب کانفیگ‌ها</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/users')
      .then(res => res.json())
      .then(users => {
        const tbody = document.getElementById('user-rows');
        const host = window.location.host;
        tbody.innerHTML = users.map(u => `
          <tr>
            <td class="fw-bold">${u.username}</td>
            <td>${u.total_gb} GB</td>
            <td>
              <button class="btn btn-sm btn-outline-info" onclick="navigator.clipboard.writeText('https://${host}/sub/${u.id}'); alert('لینک ساب کپی شد');">کپی ساب مستقیم</button>
            </td>
            <td>
              <a href="/subpage/${u.id}" target="_blank" class="btn btn-sm btn-success">مشاهده صفحه کپی</a>
            </td>
            <td>
              <a href="/api/users/delete/${u.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('حذف شود؟')">حذف</a>
            </td>
          </tr>
        `).join('');
      });
  </script>
</body>
</html>
