<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ONEX • Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- تگ‌های جلوگیری از کش شدن مرورگر جهت اعمال آنی تغییرات -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 40px;
      position: relative;
      background-color: #030a16;
      /* پس زمینه گرادیانت کوهستان و افق تاریک شب */
      background: 
        radial-gradient(circle at 50% 16%, rgba(2, 132, 199, 0.42) 0%, transparent 45%),
        radial-gradient(circle at 82% 8%, rgba(56, 189, 248, 0.22) 0%, transparent 35%),
        linear-gradient(to bottom, #07172e 0%, #030b18 55%, #01040a 100%);
      color: #f1f5f9;
      overflow-x: hidden;
    }

    /* جلوه تصویری خطوط نوری قطار پرسرعت در افق */
    .train-light-effect {
      position: absolute;
      top: 24%;
      right: -10%;
      width: 65%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.9) 60%, #ffffff 95%, transparent 100%);
      box-shadow: 0 0 16px #38bdf8, 0 0 30px #0284c7;
      transform: rotate(-3.5deg);
      opacity: 0.75;
      animation: trainPulse 3.5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes trainPulse {
      0% { opacity: 0.35; transform: rotate(-3.5deg) translateX(5%); }
      100% { opacity: 0.95; transform: rotate(-3.5deg) translateX(-15%); filter: drop-shadow(0 0 10px #38bdf8); }
    }

    /* صحنه لوگوی سه‌بعدی و شناور ONEX */
    .hero-sphere-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      z-index: 10;
    }

    .sphere-container {
      width: 130px;
      height: 130px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* هاله نئونی پشت کره */
    .sphere-aura {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.15) 60%, transparent 80%);
      filter: blur(18px);
      animation: pulseAura 2.8s ease-in-out infinite alternate;
    }

    /* حلقه مداری چرخان دور کره */
    .orbit-ring-anim {
      position: absolute;
      width: 148px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 18px #38bdf8, inset 0 0 12px #0284c7;
      transform: rotateX(68deg) rotateZ(28deg);
      animation: orbitSpin 7.5s linear infinite;
    }

    .orbit-ring-dashed {
      position: absolute;
      width: 140px;
      height: 50px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transform: rotateX(68deg) rotateZ(-32deg);
      animation: orbitSpinRev 5.5s linear infinite;
    }

    /* گوی شیشه‌ای و بازتاب نوری */
    .sphere-3d-ball {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 26%, #f0f9ff 0%, #38bdf8 35%, #0284c7 65%, #082f49 90%, #031422 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      box-shadow: 
        0 10px 30px rgba(2, 132, 199, 0.8),
        0 0 45px rgba(56, 189, 248, 0.55),
        inset 0 3px 12px rgba(255, 255, 255, 0.85),
        inset 0 -6px 14px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      animation: floatBall 3s ease-in-out infinite alternate;
    }

    .sphere-bolt-icon {
      font-size: 38px;
      color: #ffffff;
      filter: drop-shadow(0 0 8px #38bdf8) drop-shadow(0 0 16px #0ea5e9);
      animation: flashBolt 1.6s ease-in-out infinite alternate;
    }

    /* عنوان سه‌بعدی کریستالی ONEX */
    .brand-title-onex {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-top: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 40%, #38bdf8 70%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(56, 189, 248, 0.75));
      text-transform: uppercase;
      font-family: 'Impact', 'Segoe UI Black', sans-serif;
    }

    /* کارت ورود دقیقاً بر اساس تصویر */
    .login-card-box {
      width: 100%;
      max-width: 380px;
      background: rgba(8, 20, 42, 0.82);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow: 
        0 25px 55px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(2, 132, 199, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(25px);
      z-index: 10;
    }

    .main-login-text {
      font-size: 23px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 4px;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .sub-login-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 22px;
      text-align: center;
    }

    form { width: 100%; }

    /* فیلدهای ورودی نام کاربری و پسورد */
    .input-row {
      width: 100%;
      height: 50px;
      background: rgba(3, 11, 24, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      margin-bottom: 14px;
      transition: all 0.25s ease;
    }

    .input-row:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .input-row input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      text-align: inherit;
      padding: 0 8px;
    }

    .field-tag {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      margin-left: 6px;
    }

    [dir="ltr"] .field-tag {
      margin-left: 0;
      margin-right: 6px;
    }

    .input-row i {
      color: #64748b;
      font-size: 15px;
    }

    .eye-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .eye-toggle-btn:hover { color: #38bdf8; }

    /* دکمه ورود نئونی با فلش */
    .btn-login-main {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.65), 0 0 15px rgba(56, 189, 248, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-login-main:hover {
      filter: brightness(1.12);
      box-shadow: 0 10px 32px rgba(56, 189, 248, 0.75);
      transform: translateY(-1px);
    }

    .btn-login-main i {
      font-size: 17px;
    }

    [dir="rtl"] .btn-login-main i {
      transform: rotate(180deg);
    }

    /* نوار کنترل تنظیمات و زبان */
    .control-tools-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .lang-switcher-box {
      display: flex;
      background: rgba(3, 11, 24, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .lang-btn {
      padding: 6px 14px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.7);
    }

    .settings-gear-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(3, 11, 24, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.25s;
    }

    .settings-gear-btn:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      transform: rotate(45deg);
    }

    .via-text-tag {
      margin-top: 16px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      width: 100%;
    }

    /* نوار پایینی متصل به تلگرام با طراحی شیک تصویر */
    .tg-dock-wrapper {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .tg-avatar-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #0284c7 65%, #075985 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.7);
      text-decoration: none;
      flex-shrink: 0;
      animation: glowPulse 2.2s infinite;
    }

    .tg-avatar-button svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .tg-info-pill-bar {
      flex: 1;
      height: 44px;
      background: rgba(3, 11, 24, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
      transition: all 0.25s;
    }

    .tg-info-pill-bar:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .channel-title-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #38bdf8;
    }

    .status-dot-green {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: blinker 1.4s infinite;
    }

    .creator-title-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #e2e8f0;
      font-weight: 700;
    }

    .creator-badge-box {
      font-size: 9px;
      background: #0284c7;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
    }

    /* کی‌فریم انیمیشن‌های مداری و شناور */
    @keyframes orbitSpin {
      0% { transform: rotateX(68deg) rotateZ(0deg); }
      100% { transform: rotateX(68deg) rotateZ(360deg); }
    }

    @keyframes orbitSpinRev {
      0% { transform: rotateX(68deg) rotateZ(360deg); }
      100% { transform: rotateX(68deg) rotateZ(0deg); }
    }

    @keyframes floatBall {
      0% { transform: translateY(0px) scale(0.98); }
      100% { transform: translateY(-7px) scale(1.02); }
    }

    @keyframes pulseAura {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.85; }
    }

    @keyframes flashBolt {
      0% { opacity: 0.85; filter: drop-shadow(0 0 6px #38bdf8); }
      100% { opacity: 1; filter: drop-shadow(0 0 14px #ffffff) drop-shadow(0 0 22px #38bdf8); }
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { box-shadow: 0 0 0 11px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    @keyframes blinker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <!-- افکت قطار نئونی -->
  <div class="train-light-effect"></div>

  <!-- بخش بالایی: راکتور سه‌بعدی و شناور ONEX -->
  <div class="hero-sphere-area">
    <div class="sphere-container">
      <div class="sphere-aura"></div>
      <div class="orbit-ring-anim"></div>
      <div class="orbit-ring-dashed"></div>
      <div class="sphere-3d-ball">
        <i class="fa-solid fa-bolt sphere-bolt-icon"></i>
      </div>
    </div>
    <div class="brand-title-onex">ONEX</div>
  </div>

  <!-- کارت اصلی ورود به پنل -->
  <div class="login-card-box">
    
    <h2 class="main-login-text" id="txtTitle">ورود به پنل</h2>
    <p class="sub-login-text" id="txtSubtitle">با نام کاربری و رمز عبور خود وارد شوید</p>

    <form id="loginForm">
      
      <!-- فیلد نام کاربری -->
      <div class="input-row">
        <i class="fa-regular fa-user"></i>
        <span class="field-tag" id="lblUser">نام کاربری</span>
        <input type="text" id="uName" placeholder="admin" required autocomplete="username">
      </div>

      <!-- فیلد رمز عبور -->
      <div class="input-row">
        <i class="fa-solid fa-key"></i>
        <span class="field-tag" id="lblPass">رمز عبور</span>
        <input type="password" id="uPass" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="eye-toggle-btn" onclick="togglePass()">
          <i class="fa-regular fa-eye" id="eyeIcon"></i>
        </button>
      </div>

      <!-- دکمه ورود با افکت نئون -->
      <button type="submit" class="btn-login-main" id="btnSubmit">
        <span id="txtBtn">ورود</span>
        <i class="fa-solid fa-arrow-left" id="btnArrow"></i>
      </button>

    </form>

    <!-- نوار گزینه‌ها (تغییر زبان و تنظیمات) -->
    <div class="control-tools-row">
      <div class="lang-switcher-box">
        <button type="button" class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-btn active" id="btnFa" onclick="setLang('fa')">FA</button>
      </div>
      <div class="settings-gear-btn" onclick="toggleAtmosphere()" title="تنظیمات افکت نوری">
        <i class="fa-solid fa-gear"></i>
      </div>
    </div>

    <div class="via-text-tag" id="txtVia">با از طریق</div>

    <!-- داک تلگرام پایینی مطابق با عکس -->
    <div class="tg-dock-wrapper">
      <a href="https://t.me/V2rayTun0" target="_blank" class="tg-avatar-button" title="کانال تلگرام @V2rayTun0">
        <svg viewBox="0 0 24 24">
          <path d="M21.6 3.6L2.8 10.9C1.5 11.4 1.5 12.2 2.6 12.5L7.4 14L18.6 6.9C19.1 6.6 19.6 6.8 19.2 7.1L10.1 15.3H10.1L9.8 19.7C10.2 19.7 10.4 19.5 10.7 19.2L12.8 17.2L17.2 20.4C18 20.9 18.6 20.6 18.8 19.6L21.7 5.8C22 4.6 21.2 4 21.6 3.6Z"/>
        </svg>
      </a>

      <a href="https://t.me/V2rayTun0" target="_blank" class="tg-info-pill-bar">
        <div class="channel-title-item">
          <span>V2rayTun0@</span>
          <span class="status-dot-green"></span>
        </div>
        <div class="creator-title-item">
          <span>Mehtif@</span>
          <span class="creator-badge-box">CREATOR</span>
        </div>
      </a>
    </div>

  </div>

  <script>
    // سیستم دو زبانه کامل
    const i18n = {
      fa: {
        title: "ورود به پنل",
        subtitle: "با نام کاربری و رمز عبور خود وارد شوید",
        userLabel: "نام کاربری",
        passLabel: "رمز عبور",
        btn: "ورود",
        via: "با از طریق",
        dir: "rtl"
      },
      en: {
        title: "Panel Login",
        subtitle: "Enter your username and password",
        userLabel: "Username",
        passLabel: "Password",
        btn: "Login",
        via: "Connect via",
        dir: "ltr"
      }
    };

    let currentLang = 'fa';

    function setLang(lang) {
      currentLang = lang;
      const data = i18n[lang];
      document.documentElement.setAttribute('dir', data.dir);
      document.documentElement.setAttribute('lang', lang);

      document.getElementById('txtTitle').innerText = data.title;
      document.getElementById('txtSubtitle').innerText = data.subtitle;
      document.getElementById('lblUser').innerText = data.userLabel;
      document.getElementById('lblPass').innerText = data.passLabel;
      document.getElementById('txtBtn').innerText = data.btn;
      document.getElementById('txtVia').innerText = data.via;

      const arrow = document.getElementById('btnArrow');
      if (lang === 'fa') {
        document.getElementById('btnFa').classList.add('active');
        document.getElementById('btnEn').classList.remove('active');
        arrow.className = 'fa-solid fa-arrow-left';
      } else {
        document.getElementById('btnEn').classList.add('active');
        document.getElementById('btnFa').classList.remove('active');
        arrow.className = 'fa-solid fa-arrow-right';
      }
    }

    // مشاهده و پنهان‌سازی رمز عبور
    function togglePass() {
      const passIn = document.getElementById('uPass');
      const eye = document.getElementById('eyeIcon');
      if (passIn.type === 'password') {
        passIn.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        passIn.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    // تغییر مود اشباع نور دکمه چرخ‌دنده
    let atmoMode = false;
    function toggleAtmosphere() {
      atmoMode = !atmoMode;
      const ball = document.querySelector('.sphere-3d-ball');
      const aura = document.querySelector('.sphere-aura');
      if (atmoMode) {
        ball.style.filter = 'brightness(1.2) contrast(1.1)';
        aura.style.filter = 'blur(25px)';
      } else {
        ball.style.filter = 'none';
        aura.style.filter = 'blur(18px)';
      }
    }

    // لاگین واقعی به بک‌اند سرور
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('uName').value,
            password: document.getElementById('uPass').value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          alert(data.error || (currentLang === 'fa' ? 'اطلاعات ورود اشتباه است' : 'Invalid credentials'));
        }
      } catch (err) {
        alert(currentLang === 'fa' ? 'خطا در برقراری ارتباط با سرور' : 'Server connection error');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
