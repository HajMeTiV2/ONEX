<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ONEX • Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s, color 0.25s, border-color 0.25s;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 70px;
      position: relative;
      background: radial-gradient(circle at top, #0f274a 0%, #071326 60%, #030812 100%);
      color: #f1f5f9;
      overflow-x: hidden;
    }

    /* کارت ورود مشابه استایل تصویر با تم آبی */
    .login-container {
      width: 100%;
      max-width: 390px;
      background: rgba(13, 27, 49, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(2, 132, 199, 0.18);
      border-radius: 28px;
      padding: 30px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(16px);
      z-index: 10;
    }

    /* لوگوی دایره‌ای اختصاصی برنامه */
    .brand-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #0284c7 0%, #082f49 70%, #031525 100%);
      border: 2px solid rgba(56, 189, 248, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      margin-bottom: 16px;
      position: relative;
    }

    .brand-circle i {
      font-size: 34px;
      color: #38bdf8;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
    }

    .login-title {
      font-size: 23px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    .login-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }

    form {
      width: 100%;
    }

    .field-wrap {
      width: 100%;
      margin-bottom: 16px;
      text-align: inherit;
    }

    .field-label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
      padding: 0 4px;
    }

    .input-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(7, 16, 30, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 14px;
      padding: 0 14px;
      height: 48px;
    }

    .input-box:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .input-box input {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 13px;
      text-align: inherit;
    }

    .input-box i {
      color: #64748b;
      font-size: 15px;
    }

    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .eye-btn:hover {
      color: #38bdf8;
    }

    /* دکمه ورود مشابه تصویر با گرادیانت آبی */
    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
    }

    /* نوار پایینی کارت: تغییر زبان و دارک مود */
    .card-footer-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .icon-pill {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(7, 16, 30, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: pointer;
    }
    .icon-pill:hover {
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* دکمه سوییچ دوگانه زبان (FA / EN) */
    .lang-switcher {
      display: flex;
      background: rgba(7, 16, 30, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
    }

    .lang-tab {
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .lang-tab.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.5);
    }

    /* دکمه شناور تلگرام در پایین صفحه مشابه تصویر همراه با اشاره‌گر */
    .bottom-telegram-hub {
      position: fixed;
      bottom: 18px;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

    .tg-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
      text-decoration: none;
      animation: pulse-glow 2s infinite;
    }

    .tg-hint-box {
      background: rgba(13, 27, 49, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      color: #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .tg-hint-box b {
      color: #38bdf8;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(14, 165, 233, 0); }
      100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- لوگوی اختصاصی برنامه -->
    <div class="brand-circle">
      <i class="fa-solid fa-bolt"></i>
    </div>

    <h2 class="login-title" id="txtTitle">ورود به پنل</h2>
    <p class="login-subtitle" id="txtSubtitle">با نام کاربری و رمز عبور خود وارد شوید</p>

    <form id="loginForm">
      <!-- فیلد نام کاربری -->
      <div class="field-wrap">
        <label class="field-label" id="lblUser">نام کاربری</label>
        <div class="input-box">
          <input type="text" id="uName" placeholder="admin" required autocomplete="username">
          <i class="fa-regular fa-user"></i>
        </div>
      </div>

      <!-- فیلد رمز عبور -->
      <div class="field-wrap">
        <label class="field-label" id="lblPass">رمز عبور</label>
        <div class="input-box">
          <button type="button" class="eye-btn" onclick="togglePass()">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
          <input type="password" id="uPass" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-key"></i>
        </div>
      </div>

      <!-- دکمه سابمیت ورود -->
      <button type="submit" class="btn-submit" id="btnSubmit">
        <span id="txtBtn">ورود</span>
      </button>
    </form>

    <!-- نوار تنظیمات دارک مود و زبان داخل کارت -->
    <div class="card-footer-controls">
      <div class="icon-pill" title="حالت شب" onclick="toggleMode()">
        <i class="fa-regular fa-moon" id="modeIcon"></i>
      </div>

      <div class="lang-switcher">
        <button type="button" class="lang-tab" id="btnEn" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-tab active" id="btnFa" onclick="setLang('fa')">FA</button>
      </div>
    </div>

  </div>

  <!-- دکمه شناور تلگرام در پایین صفحه با اشاره‌گر کلیک و نام سازنده -->
  <div class="bottom-telegram-hub">
    <a href="https://t.me/V2rayTun0" target="_blank" class="tg-circle-btn" title="کانال تلگرام @V2rayTun0">
      <i class="fa-brands fa-telegram"></i>
    </a>
    <div class="tg-hint-box">
      سازنده: <b>@Mehtif</b> | کانال: <a href="https://t.me/V2rayTun0" target="_blank" style="color: #38bdf8; text-decoration: none; font-weight: 700;">@V2rayTun0</a>
      <div style="font-size: 9px; color: #94a3b8; margin-top: 1px;">👉 برای عضویت کلیک کنید</div>
    </div>
  </div>

  <script>
    // دیکشنری دو زبانه فارسی و انگلیسی
    const i18n = {
      fa: {
        title: "ورود به پنل",
        subtitle: "با نام کاربری و رمز عبور خود وارد شوید",
        userLabel: "نام کاربری",
        passLabel: "رمز عبور",
        btn: "ورود",
        dir: "rtl"
      },
      en: {
        title: "Panel Login",
        subtitle: "Enter your username and password",
        userLabel: "Username",
        passLabel: "Password",
        btn: "Login",
        dir: "ltr"
      }
    };

    let currentLang = 'fa';

    function setLang(lang) {
      currentLang = lang;
      const data = i18n[lang];
      document.documentElement.setAttribute('dir', data.dir);
      document.documentElement.setAttribute('lang', lang);

      document.getElementById('txtTitle').innerText = data.title;
      document.getElementById('txtSubtitle').innerText = data.subtitle;
      document.getElementById('lblUser').innerText = data.userLabel;
      document.getElementById('lblPass').innerText = data.passLabel;
      document.getElementById('txtBtn').innerText = data.btn;

      if (lang === 'fa') {
        document.getElementById('btnFa').classList.add('active');
        document.getElementById('btnEn').classList.remove('active');
      } else {
        document.getElementById('btnEn').classList.add('active');
        document.getElementById('btnFa').classList.remove('active');
      }
    }

    // نمایش و مخفی کردن رمز عبور
    function togglePass() {
      const passIn = document.getElementById('uPass');
      const eye = document.getElementById('eyeIcon');
      if (passIn.type === 'password') {
        passIn.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        passIn.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    // تغییر مود نور (روز / شب)
    let isDark = true;
    function toggleMode() {
      isDark = !isDark;
      const icon = document.getElementById('modeIcon');
      if (!isDark) {
        document.body.style.background = 'radial-gradient(circle at top, #1e3a8a 0%, #0c4a6e 60%, #032342 100%)';
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        document.body.style.background = 'radial-gradient(circle at top, #0f274a 0%, #071326 60%, #030812 100%)';
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    }

    // سابمیت و لاگین به سرور
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('uName').value,
            password: document.getElementById('uPass').value
          })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = '/';
        } else {
          alert(data.error || (currentLang === 'fa' ? 'اطلاعات ورود اشتباه است' : 'Invalid credentials'));
        }
      } catch (err) {
        alert(currentLang === 'fa' ? 'خطا در برقراری ارتباط با سرور' : 'Server connection error');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
