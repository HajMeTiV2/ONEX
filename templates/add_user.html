
{% extends 'base.html' %}
{% block content %}
<div class="mb-4 fade-up">
    <h3 class="fw-bold mb-1">
        <i class="fas fa-user-plus me-2" style="color: var(--primary);"></i>
        افزودن کاربر جدید
    </h3>
    <p class="text-muted small">ایجاد کانفیگ جدید</p>
</div>

<div class="glass-card p-4 fade-up" style="max-width: 750px;">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label"><i class="fas fa-user me-1"></i> نام کاربری</label>
                <input type="text" name="username" class="form-control" placeholder="user1" required>
            </div>

            <div class="col-md-3">
                <label class="form-label"><i class="fas fa-shield me-1"></i> پروتکل</label>
                <select name="protocol" class="form-select">
                    <option value="vless">VLESS</option>
                    <option value="vmess">VMess</option>
                    <option value="trojan">Trojan</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label"><i class="fas fa-copy me-1"></i> تعداد</label>
                <input type="number" name="count" class="form-control" value="1" min="1" max="100">
                <small class="text-muted">ساخت دسته‌جمعی</small>
            </div>

            <div class="col-md-4">
                <label class="form-label"><i class="fas fa-database me-1"></i> حجم (GB)</label>
                <input type="number" name="data_limit" id="dataLimit" class="form-control" value="10" min="0" step="0.5">
                <small class="text-muted">0 = نامحدود</small>
            </div>

            <div class="col-md-4">
                <label class="form-label"><i class="fas fa-calendar me-1"></i> مدت (روز)</label>
                <input type="number" name="duration_days" id="duration" class="form-control" value="30" min="0">
                <small class="text-muted">0 = نامحدود</small>
            </div>

            <div class="col-md-4">
                <label class="form-label"><i class="fas fa-link me-1"></i> اتصال همزمان</label>
                <input type="number" name="max_connections" id="maxConn" class="form-control" value="1" min="1" max="100">
            </div>

            <div class="col-12">
                <label class="form-label"><i class="fas fa-sticky-note me-1"></i> یادداشت</label>
                <input type="text" name="note" class="form-control" placeholder="اختیاری...">
            </div>

            <!-- Quick Plans -->
            <div class="col-12">
                <label class="form-label"><i class="fas fa-bolt me-1" style="color: var(--warning);"></i> پلن‌های سریع</label>
                <div class="d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(10, 30, 1)">
                        📦 10GB / 30 روز
                    </button>
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(20, 30, 1)">
                        📦 20GB / 30 روز
                    </button>
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(30, 30, 2)">
                        📦 30GB / 30 روز
                    </button>
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(50, 30, 2)">
                        📦 50GB / 30 روز
                    </button>
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(100, 30, 3)">
                        📦 100GB / 30 روز
                    </button>
                    <button type="button" class="btn btn-onex-outline btn-onex-sm" onclick="setPlan(0, 0, 10)" style="border-color: var(--success); color: var(--success);">
                        ♾️ نامحدود
                    </button>
                </div>
            </div>
        </div>

        <hr style="border-color: var(--border); margin: 24px 0;">

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-onex">
                <i class="fas fa-plus me-1"></i> ایجاد کاربر
            </button>
            <a href="{{ url_for('users') }}" class="btn btn-onex-outline">
                <i class="fas fa-arrow-right me-1"></i> بازگشت
            </a>
        </div>
    </form>
</div>

<script>
function setPlan(data, days, conn) {
    document.getElementById('dataLimit').value = data;
    document.getElementById('duration').value = days;
    document.getElementById('maxConn').value = conn;
}
</script>
{% endblock %}
