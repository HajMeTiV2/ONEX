<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحه اشتراک ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #050711;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex; justify-content: center;
    }
    .wrapper { width: 100%; max-width: 500px; }
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 18px;
    }
    .qr-box {
      background: #fff; padding: 12px; border-radius: 14px;
      display: inline-block; margin: 15px auto;
    }
    .badge {
      display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      background: rgba(56, 189, 248, 0.15); color: #38bdf8;
    }
    .copy-row {
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 12px; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .btn-copy {
      background: #0284c7; border: none; border-radius: 8px; padding: 8px 14px;
      color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    
    <!-- اطلاعات اکانت -->
    <div class="glass-card" style="text-align: center;">
      <h2 style="font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px;">ONEX Fast Connect</h2>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">طراحی شده توسط @Mehtif | <a href="https://t.me/V2rayTunp" target="_blank" style="color:#38bdf8; text-decoration: none;">@V2rayTunp</a></p>
      
      <div style="display: flex; justify-content: center; gap: 10px;">
        <span class="badge" id="u-name">کاربر: ...</span>
        <span class="badge" id="u-gb" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">حجم: 0 GB</span>
      </div>

      <div class="qr-box">
        <div id="sub-qrcode"></div>
      </div>
      <p style="font-size: 12px; color: #64748b;">برای اتصال در v2rayNG یا Streisand اسکن کنید</p>
    </div>

    <!-- لینک مستقیم ساب -->
    <div class="glass-card">
      <span style="font-size: 13px; color: #fbbf24; font-weight: 700; display: block; margin-bottom: 8px;">
        <i class="fa-solid fa-bolt"></i> لینک ساب‌اسکریپشن هوشمند
      </span>
      <div class="copy-row">
        <input type="text" id="sub-url" readonly style="background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 12px;">
        <button class="btn-copy" style="background: #eab308; color: #000;" onclick="copyField('sub-url')">کپی لینک ساب</button>
      </div>
    </div>

    <!-- کانفیگ‌های دستی -->
    <div class="glass-card">
      <span style="font-size: 13px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 12px;">کانفیگ‌های دستی:</span>

      <div class="copy-row">
        <span style="font-size: 13px;">پروتکل VLESS</span>
        <input type="hidden" id="cfg-vless">
        <button class="btn-copy" onclick="copyField('cfg-vless')">کپی VLESS</button>
      </div>

      <div class="copy-row">
        <span style="font-size: 13px;">پروتکل VMess</span>
        <input type="hidden" id="cfg-vmess">
        <button class="btn-copy" onclick="copyField('cfg-vmess')">کپی VMess</button>
      </div>

      <div class="copy-row">
        <span style="font-size: 13px;">پروتکل Trojan</span>
        <input type="hidden" id="cfg-trojan">
        <button class="btn-copy" onclick="copyField('cfg-trojan')">کپی Trojan</button>
      </div>

      <div class="copy-row">
        <span style="font-size: 13px;">پروتکل Shadowsocks</span>
        <input type="hidden" id="cfg-ss">
        <button class="btn-copy" onclick="copyField('cfg-ss')">کپی SS</button>
      </div>
    </div>

  </div>

  <script>
    const id = window.location.pathname.split('/').pop();
    fetch('/api/subinfo/' + id)
      .then(res => res.json())
      .then(data => {
        document.getElementById('u-name').innerText = 'کاربر: ' + data.user.username;
        document.getElementById('u-gb').innerText = 'حجم: ' + data.user.total_gb + ' GB';
        document.getElementById('sub-url').value = data.subUrl;

        document.getElementById('cfg-vless').value = data.configs.vlessUri;
        document.getElementById('cfg-vmess').value = data.configs.vmessUri;
        document.getElementById('cfg-trojan').value = data.configs.trojanUri;
        document.getElementById('cfg-ss').value = data.configs.ssUri;

        new QRCode(document.getElementById("sub-qrcode"), {
          text: data.subUrl,
          width: 140,
          height: 140
        });
      });

    function copyField(elementId) {
      const val = document.getElementById(elementId).value;
      navigator.clipboard.writeText(val);
      alert('کپی شد!');
    }
  </script>
</body>
</html>
