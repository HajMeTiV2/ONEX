
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONEX | ورود به حساب کاربری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    .glass-box { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .neon-glow { box-shadow: 0 0 25px rgba(6, 182, 212, 0.35); }
  </style>
</head>
<body class="bg-[#040711] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Glow Lights -->
  <div class="absolute top-1/3 -right-20 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/3 -left-20 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Header Logo & Branding -->
    <div class="text-center mb-8 flex flex-col items-center">
      <!-- SVG ONEX LOGO -->
      <svg class="w-20 h-20 mb-3 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="onexG" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <rect x="6" y="6" width="88" height="88" rx="26" fill="#0b1120" stroke="url(#onexG)" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="26" stroke="url(#onexG)" stroke-width="4.5" stroke-dasharray="115 35"/>
        <path d="M39 39L61 61M61 39L39 61" stroke="url(#onexG)" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3.5" fill="#22d3ee"/>
      </svg>
      <h1 class="text-3xl font-black text-white tracking-wider">ON<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">EX</span></h1>
      <p class="text-xs text-slate-400 mt-1">پنل مدیریت اشتراک و سرویس‌های پرسرعت</p>
    </div>

    <!-- Login Box -->
    <div class="glass-box rounded-3xl p-7 shadow-2xl">
      <h2 class="text-base font-bold text-white mb-5">ورود به پنل کاربری</h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1.5">نام کاربری</label>
          <input type="text" id="username" value="admin" required
            class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-cyan-500 transition-all">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1.5">رمز عبور</label>
          <input type="password" id="password" value="admin123" required
            class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-cyan-500 transition-all">
        </div>

        <div id="errMsg" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl p-3"></div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 hover:opacity-90 text-white font-bold py-3.5 rounded-xl transition-all neon-glow cursor-pointer">
          ورود به داشبورد
        </button>
      </form>

      <!-- Telegram Banner Button -->
      <a href="https://t.me/V2rayTun0" target="_blank"
        class="mt-6 flex items-center justify-center gap-2.5 w-full bg-slate-900/60 hover:bg-[#0088cc]/10 border border-slate-800 hover:border-[#0088cc]/40 py-3 rounded-2xl text-xs text-slate-300 transition-all duration-300">
        <svg class="w-4 h-4 text-[#0088cc]" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.943z"/>
        </svg>
        عضویت در کانال رسمی <span class="font-bold text-[#0088cc]">@V2rayTun0</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6">
      <p class="text-[11px] text-slate-500">
        توسعه داده شده توسط <a href="https://t.me/Mehtif" target="_blank" class="text-cyan-400 font-bold hover:underline">@Mehtif</a>
      </p>
    </div>

  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errMsg');
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = `/dashboard/${data.token}`;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
