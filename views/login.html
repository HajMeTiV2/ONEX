
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ورود به سامانه ابری ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #030712 100%);
      color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .auth-card {
      width: 100%; max-width: 380px; background: #0c1220; border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 28px 22px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center;
    }
    .brand-title { font-size: 24px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
    .input-group { position: relative; margin-bottom: 14px; text-align: right; }
    .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
    .input-box {
      width: 100%; padding: 12px 14px; background: #060a14; border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: border 0.2s;
    }
    .input-box:focus { border-color: #0284c7; }
    .btn-login {
      width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s;
    }
    .btn-login:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-title">
      <i class="fa-solid fa-bolt"></i>
      <span>ONEX CLOUD</span>
    </div>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 22px;">ورود به پنل مدیریت سرورها</p>

    <form id="loginForm">
      <div class="input-group">
        <label>نام کاربری:</label>
        <input type="text" id="uName" class="input-box" placeholder="admin" required>
      </div>

      <div class="input-group">
        <label>رمز عبور:</label>
        <input type="password" id="uPass" class="input-box" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn-login">ورود به پنل</button>
    </form>

    <div style="margin-top: 20px; font-size: 11px; color: #475569;">
      سازنده: <span style="color: #38bdf8;">@Mehtif</span> | 
      کانال: <a href="https://t.me/V2rayTun0" target="_blank" style="color: #38bdf8; text-decoration: none;">@V2rayTun0</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('uName').value,
          password: document.getElementById('uPass').value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/';
      } else {
        alert(data.error || 'اطلاعات نامعتبر است');
      }
    });
  </script>
</body>
</html>
