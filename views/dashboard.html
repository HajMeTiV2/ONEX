<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ONEX Cloud Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070b14; color: #f8fafc; min-height: 100vh; display: flex; }
    
    .sidebar {
      width: 230px; background: #0c1220; border-left: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px 14px;
      position: fixed; top: 0; bottom: 0; right: 0; z-index: 100;
    }
    .brand { font-size: 20px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .nav-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
      color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; width: 100%; text-align: inherit;
    }
    .nav-btn:hover, .nav-btn.active { background: #0284c7; color: #fff; }
    .nav-btn i { width: 18px; }

    .main-viewport { flex: 1; margin-right: 230px; padding: 20px 24px; min-height: 100vh; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { border-radius: 14px; padding: 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .bg-g1 { background: linear-gradient(135deg, #059669, #10b981); }
    .bg-g2 { background: linear-gradient(135deg, #0284c7, #38bdf8); }
    .bg-g3 { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .bg-g4 { background: linear-gradient(135deg, #0891b2, #06b6d4); }

    .panel-box { background: #0d1424; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
    .ui-table { width: 100%; border-collapse: collapse; text-align: right; font-size: 13px; }
    .ui-table th { padding: 12px; color: #64748b; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .ui-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }

    .btn-main {
      padding: 8px 16px; background: #0284c7; border: none; border-radius: 8px;
      color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-del { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

    .modal-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 200; align-items: center; justify-content: center; padding: 14px; }
    .modal-box { width: 100%; max-width: 480px; background: #0c1220; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 22px; }
    .input-field { width: 100%; padding: 10px 14px; background: #070b14; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #fff; font-size: 13px; margin-bottom: 12px; outline: none; }

    @media (max-width: 850px) {
      body { flex-direction: column; padding-bottom: 70px; }
      .sidebar { width: 100%; height: 60px; top: auto; bottom: 0; right: 0; left: 0; flex-direction: row; align-items: center; padding: 2px 10px; border-top: 1px solid rgba(255,255,255,0.08); border-left: none; }
      .brand, .sidebar-footer { display: none; }
      .nav-list { flex-direction: row; justify-content: space-around; width: 100%; margin: 0; }
      .nav-btn { flex-direction: column; gap: 2px; padding: 4px; font-size: 9px; }
      .main-viewport { margin-right: 0 !important; padding: 14px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand"><i class="fa-solid fa-bolt"></i><span>ONEX</span></div>
      <ul class="nav-list">
        <li><button class="nav-btn active"><i class="fa-solid fa-house"></i><span>داشبورد</span></button></li>
        <li><button class="nav-btn" onclick="openModal()"><i class="fa-solid fa-plus-circle"></i><span>ساخت کانفیگ</span></button></li>
        <li><button class="nav-btn"><i class="fa-solid fa-server"></i><span>سرورها</span></button></li>
        <li><button class="nav-btn"><i class="fa-solid fa-chart-line"></i><span>مصرف و ترافیک</span></button></li>
        <li><button class="nav-btn"><i class="fa-solid fa-gear"></i><span>تنظیمات</span></button></li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <a href="/logout" class="nav-btn" style="color:#ef4444;"><i class="fa-solid fa-power-off"></i><span>خروج</span></a>
    </div>
  </aside>

  <main class="main-viewport">
    <header class="topbar">
      <div>
        <h3 style="font-size: 16px; font-weight: 800;">داشبورد مدیریت ONEX</h3>
        <small style="color: #64748b; font-size: 11px;">توسعه‌دهنده: <span style="color:#38bdf8;">@Mehtif</span> | کانال: <a href="https://t.me/V2rayTunp" target="_blank" style="color:#38bdf8; text-decoration:none;">@V2rayTunp</a></small>
      </div>
      <button class="btn-main" onclick="openModal()"><i class="fa-solid fa-plus"></i> ساخت کانفیگ جدید</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card bg-g1"><span>وضعیت سرویس</span><h2 style="font-size: 22px; font-weight: 800; margin-top: 4px;">آنلاین</h2></div>
      <div class="stat-card bg-g2"><span>حجم مصرفی سرور</span><h2 style="font-size: 22px; font-weight: 800; margin-top: 4px;" id="st-used">0 GB</h2></div>
      <div class="stat-card bg-g3"><span>زمان اعتبار</span><h2 style="font-size: 22px; font-weight: 800; margin-top: 4px;">۲۷ روز</h2></div>
      <div class="stat-card bg-g4"><span>تعداد کانفیگ‌ها</span><h2 style="font-size: 22px; font-weight: 800; margin-top: 4px;" id="st-count">0</h2></div>
    </div>

    <div class="panel-box">
      <h4 style="font-size: 15px; margin-bottom: 14px;">کانفیگ‌های تعریف شده</h4>
      <div style="overflow-x: auto;">
        <table class="ui-table">
          <thead>
            <tr><th>نام کانفیگ</th><th>سرور</th><th>حجم مصرفی</th><th>مدت اعتبار</th><th>لینک مرورگر ساب</th><th>عملیات</th></tr>
          </thead>
          <tbody id="cfgBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-wrap" id="createModal">
    <div class="modal-box">
      <h3 style="font-size: 16px; color:#38bdf8; margin-bottom: 14px;">ساخت کانفیگ جدید (VLESS + VMess + Trojan)</h3>
      <form id="addForm">
        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">نام کاربر:</label>
        <input type="text" id="m-name" class="input-field" placeholder="مثال: گوشی من" required>
        
        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">سرور:</label>
        <select id="m-server" class="input-field">
          <option value="Germany (DE)">🇩🇪 Germany (DE)</option>
          <option value="Netherlands (NL)">🇳🇱 Netherlands (NL)</option>
          <option value="Turkey (TR)">🇹🇷 Turkey (TR)</option>
        </select>

        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">حجم مجاز (GB):</label>
        <input type="number" id="m-gb" class="input-field" value="20" required>

        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">مدت اعتبار (روز):</label>
        <input type="number" id="m-days" class="input-field" value="30" required>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button type="submit" class="btn-main" style="flex:1; justify-content:center;">تولید فوری</button>
          <button type="button" class="btn-main btn-del" onclick="closeModal()">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openModal() { document.getElementById('createModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('createModal').style.display = 'none'; }

    async function loadData() {
      const res = await fetch('/api/panel-data').then(r => r.json());
      document.getElementById('st-count').innerText = res.configsCount;
      document.getElementById('st-used').innerText = res.totalUsed + ' GB';

      const host = window.location.host;
      const tbody = document.getElementById('cfgBody');
      tbody.innerHTML = res.configs.map(c => `
        <tr>
          <td><b>${c.name}</b></td>
          <td>${c.server}</td>
          <td>${c.used_gb} / ${c.total_gb} GB</td>
          <td>${c.expire_days} روز</td>
          <td>
            <a href="/subpage/${c.id}" target="_blank" class="btn-main" style="background:#6366f1;">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> باز کردن صفحه ساب
            </a>
          </td>
          <td>
            <button class="btn-main" onclick="navigator.clipboard.writeText('https://${host}/sub/${c.id}'); alert('ساب متنی کپی شد!');">کپی ساب</button>
            <button class="btn-main btn-del" onclick="delCfg('${c.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/configs/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('m-name').value,
          server: document.getElementById('m-server').value,
          total_gb: document.getElementById('m-gb').value,
          expire_days: document.getElementById('m-days').value
        })
      });
      closeModal();
      loadData();
    });

    async function delCfg(id) {
      if(confirm('حذف شود؟')) {
        await fetch('/api/configs/' + id, { method: 'DELETE' });
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
