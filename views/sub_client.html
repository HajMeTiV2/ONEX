<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ONEX • پورتال هوشمند اشتراک</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-main: #070e1b;
      --bg-card: rgba(16, 26, 48, 0.75);
      --border-color: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden; }

    .portal-container {
      width: 100%; max-width: 480px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 24px; padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(20px); transform: perspective(1000px);
    }

    /* هدر با لوگوی ۳بعدی و وضعیت آنلاین/آفلاین */
    .portal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .logo-3d {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 50%, #0369a1 100%);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4); transform: perspective(500px) rotateX(10deg) rotateY(-10deg);
    }
    
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 5px;
    }
    .status-online { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* باکس اطلاعیه همگانی */
    #announcementBox {
      display: none; border: 1px solid rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.1);
      border-radius: 14px; padding: 12px; margin-bottom: 16px; text-align: center;
    }

    /* بخش اطلاعات حجم و مصرف */
    .usage-card {
      background: rgba(0, 0, 0, 0.35); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); border-radius: 4px; width: 0%; transition: width 0.5s ease; }

    /* دکمه‌های اکشن اصلی */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .btn-action {
      padding: 12px; border-radius: 12px; border: none; font-size: 12.5px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border-color); }
    .btn-full { grid-column: span 2; background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; }
    .btn-action:hover { filter: brightness(1.1); transform: translateY(-1px); }

    /* فوتر و اطلاعات سازنده */
    .portal-footer {
      display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color);
      padding-top: 14px; margin-top: 16px; font-size: 11.5px; color: var(--text-muted);
    }
    .channel-link { color: var(--accent); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .channel-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="portal-container">
    
    <!-- هدر پورتال -->
    <div class="portal-header">
      <div class="brand-box">
        <div class="logo-3d"><i class="fa-solid fa-bolt"></i></div>
        <div>
          <h3 style="font-size: 15px; font-weight: 900; color: var(--accent);" id="clientNameTitle">بارگذاری...</h3>
          <small style="font-size: 10.5px; color: var(--text-muted);" id="clientProtocolTitle">مختص اشتراک ابری</small>
        </div>
      </div>
      <div id="statusBadgeContainer">
        <span class="status-badge status-offline"><i class="fa-solid fa-circle"></i> بررسی...</span>
      </div>
    </div>

    <!-- اطلاعیه همگانی ادمین -->
    <div id="announcementBox">
      <h4 style="font-size: 11.5px; color: #fbbf24; margin-bottom: 3px;"><i class="fa-solid fa-bullhorn"></i> اطلاعیه مهم</h4>
      <p style="font-size: 11px; color: #fef3c7;" id="announcementText">--</p>
    </div>

    <!-- کارت وضعیت حجم و ترافیک -->
    <div class="usage-card">
      <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
        <span style="color: var(--text-muted);">مصرف کل ترافیک:</span>
        <b id="usedTrafficText">0 GB / 0 GB</b>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="usageProgressBar"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 6px;">
        <span>باقی‌مانده: <b id="remainingTrafficText" style="color: #34d399;">0 GB</b></span>
        <span>اعتبار زمانی: <b id="expireDaysText" style="color: var(--accent);">30 روز</b></span>
      </div>
    </div>

    <!-- دکمه‌های کپی و دسترسی -->
    <div class="action-grid">
      <button class="btn-action btn-primary" onclick="copyAllConfigs()"><i class="fa-solid fa-copy"></i> کپی همه کانفیگ‌ها</button>
      <button class="btn-action btn-secondary" onclick="copySubLink()"><i class="fa-solid fa-link"></i> کپی لینک ساب</button>
      <button class="btn-action btn-full" onclick="openQrModal()"><i class="fa-solid fa-qrcode"></i> نمایش QR Code اشتراک</button>
    </div>

    <!-- فوتر با لینک کانال تلگرام و اسم سازنده -->
    <div class="portal-footer">
      <div>Developer: <b style="color: var(--text-main);">@MehTif</b></div>
      <a href="https://t.me/V2rayTun0" target="_blank" class="channel-link">
        <i class="fa-brands fa-telegram" style="font-size: 14px;"></i> @V2rayTun0
      </a>
    </div>

  </div>

  <!-- مودال QR Code -->
  <div style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 300; align-items: center; justify-content: center; padding: 16px;" id="qrModal">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; text-align: center; max-width: 340px; width: 100%;">
      <h3 style="font-size: 15px; color: var(--accent); margin-bottom: 12px; font-weight: 800;">QR Code اشتراک</h3>
      <div style="background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin-bottom: 14px;" id="qrcodeBox"></div>
      <button class="btn-action btn-primary" style="width: 100%; justify-content: center;" onclick="closeQrModal()">بستن</button>
    </div>
  </div>

  <script>
    let rawSubText = '';
    let currentSubUrl = '';

    const pathSegments = window.location.pathname.split('/');
    const configId = pathSegments[pathSegments.length - 1];

    async function loadPortalData() {
      try {
        const res = await fetch(`/api/subinfo/${configId}`).then(r => r.json());
        if (res.config) {
          const c = res.config;
          document.getElementById('clientNameTitle').innerText = c.name;
          document.getElementById('clientProtocolTitle').innerText = `پروتکل: ${(c.protocol || 'all').toUpperCase()}`;
          
          // وضعیت آنلاین/آفلاین بر اساس فعال بودن و داشتن حجم/تاریخ
          const badgeContainer = document.getElementById('statusBadgeContainer');
          if (c.status === 'active') {
            badgeContainer.innerHTML = `<span class="status-badge status-online"><i class="fa-solid fa-circle"></i> آنلاین (فعال)</span>`;
          } else if (c.status === 'pending') {
            badgeContainer.innerHTML = `<span class="status-badge status-online" style="background:rgba(56,189,248,0.2); color:#38bdf8;"><i class="fa-solid fa-circle"></i> آماده اتصال</span>`;
          } else {
            badgeContainer.innerHTML = `<span class="status-badge status-offline"><i class="fa-solid fa-circle"></i> آفلاین (منقضی)</span>`;
          }

          // محاسبه حجم و درصد پیشرفت
          const used = c.used_gb || 0;
          const total = c.total_gb || 15;
          const percent = Math.min(100, Math.round((used / total) * 100));

          document.getElementById('usedTrafficText').innerText = `${used.toFixed(2)} GB / ${total} GB`;
          document.getElementById('remainingTrafficText').innerText = `${res.remainingGb} GB`;
          document.getElementById('usageProgressBar').style.width = `${percent}%`;
          document.getElementById('expireDaysText').innerText = `${c.expire_days || 30} روز`;

          currentSubUrl = res.subUrl;

          // دریافت لینک‌های کامل برای کپی همزمان همه پروتکل‌ها
          const subTextRes = await fetch(`/sub/${configId}`).then(r => r.text());
          rawSubText = atob(subTextRes);
        }
      } catch (e) {
        document.getElementById('clientNameTitle').innerText = 'خطا در بارگذاری';
      }

      // دریافت اطلاعیه همگانی
      try {
        const annRes = await fetch('/api/announcement').then(r => r.json());
        if (annRes.message && annRes.message.trim() !== '') {
          document.getElementById('announcementText').innerText = annRes.message;
          document.getElementById('announcementBox').style.display = 'block';
        }
      } catch (e) {}
    }

    function copyAllConfigs() {
      if (!rawSubText) { alert('اطلاعات در حال بارگذاری است...'); return; }
      navigator.clipboard.writeText(rawSubText);
      alert('📋 تمام کانفیگ‌های تمام پروتکل‌ها با موفقیت کپی شدند!');
    }

    function copySubLink() {
      if (!currentSubUrl) { alert('لینک در دسترس نیست.'); return; }
      navigator.clipboard.writeText(currentSubUrl);
      alert('🔗 لینک اشتراک (Subscription) کپی شد!');
    }

    function openQrModal() {
      if (!currentSubUrl) return;
      document.getElementById('qrcodeBox').innerHTML = '';
      new QRCode(document.getElementById('qrcodeBox'), { text: currentSubUrl, width: 150, height: 150 });
      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal() {
      document.getElementById('qrModal').style.display = 'none';
    }

    loadPortalData();
  </script>
</body>
</html>
