<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پورتال اشتراک • NEXO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: #070e1b;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .sub-card {
            background: rgba(16, 26, 48, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .logo-box {
            width: 50px; height: 50px; border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #fff; margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }
        h2 { font-size: 18px; font-weight: 900; color: #38bdf8; margin-bottom: 6px; }
        .sub-desc { font-size: 11.5px; color: #94a3b8; margin-bottom: 20px; }
        
        .info-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 13px;
        }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: #94a3b8; }
        .info-val { font-weight: bold; color: #f8fafc; }

        .status-alert {
            padding: 12px;
            border-radius: 10px;
            font-size: 12.5px;
            margin-bottom: 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn-action:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-action:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

        .footer-tag { font-size: 10.5px; color: #64748b; margin-top: 14px; }
    </style>
</head>
<body>

    <div class="sub-card">
        <div class="logo-box"><i class="fa-solid fa-bolt"></i></div>
        <h2>اشتراک اختصاصی NEXO</h2>
        <div class="sub-desc">پورتال مدیریت و دریافت کانفیگ‌های پرسرعت</div>

        <div id="status-box" class="status-alert">
            <i class="fa-solid fa-spinner fa-spin"></i> در حال بارگذاری اطلاعات اشتراک...
        </div>

        <div class="info-box" id="detailsBox" style="display: none;">
            <div class="info-row">
                <span class="info-label">نام اشتراک:</span>
                <span class="info-val" id="val-name">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">پروتکل:</span>
                <span class="info-val" id="val-protocol" style="color: #38bdf8;">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">حجم کل:</span>
                <span class="info-val" id="val-gb">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">وضعیت:</span>
                <span class="info-val" id="val-status" style="color: #34d399;">فعال</span>
            </div>
        </div>

        <button id="copy-btn" class="btn-action" onclick="copyConfigs()" disabled>
            <i class="fa-solid fa-copy"></i> کپی کردن کانفیگ‌ها
        </button>

        <div class="footer-tag">Powered by @MehTif • @V2rayTun0</div>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const subId = pathSegments[pathSegments.length - 1];

        async function loadSubscriptionData() {
            const statusBox = document.getElementById('status-box');
            const copyBtn = document.getElementById('copy-btn');
            const detailsBox = document.getElementById('detailsBox');

            if (!subId) {
                statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> خطا: شناسه اشتراک معتبر نیست.';
                statusBox.style.color = '#f87171';
                statusBox.style.background = 'rgba(239, 68, 68, 0.1)';
                statusBox.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                return;
            }

            try {
                const response = await fetch(`/api/subscription/${subId}/json`);
                const result = await response.json();

                if (response.ok && result.success) {
                    const cfg = result.data;
                    statusBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> اشتراک شما معتبر و آماده استفاده است.';
                    statusBox.style.color = '#34d399';
                    statusBox.style.background = 'rgba(16, 185, 129, 0.1)';
                    statusBox.style.borderColor = 'rgba(16, 185, 129, 0.3)';

                    document.getElementById('val-name').innerText = cfg.name || 'NEXO Client';
                    document.getElementById('val-protocol').innerText = (cfg.protocol || 'all').toUpperCase();
                    document.getElementById('val-gb').innerText = (cfg.total_gb || 20) + ' GB';
                    
                    detailsBox.style.display = 'block';
                    copyBtn.disabled = false;
                } else {
                    throw new Error(result.error || 'کانفیگ‌ها موجود نیستند');
                }
            } catch (error) {
                console.error('Error:', error);
                statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> خطا: کانفیگ‌ها موجود نیستند یا اشتراک منقضی شده است.';
                statusBox.style.color = '#f87171';
                statusBox.style.background = 'rgba(239, 68, 68, 0.1)';
                statusBox.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                copyBtn.disabled = true;
            }
        }

        async function copyConfigs() {
            const copyBtn = document.getElementById('copy-btn');
            const originalHtml = copyBtn.innerHTML;

            try {
                copyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> در حال دریافت و کپی...';
                copyBtn.disabled = true;

                const response = await fetch(`/sub/${subId}`);
                if (!response.ok) throw new Error('خطا در دریافت لینک اشتراک');
                
                const textContent = await response.text();
                await navigator.clipboard.writeText(textContent);

                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> با موفقیت کپی شد!';
                copyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                copyBtn.style.color = '#fff';

                setTimeout(() => {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.style.background = '';
                    copyBtn.style.color = '';
                    copyBtn.disabled = false;
                }, 2500);

            } catch (err) {
                console.error('Failed to copy:', err);
                copyBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> خطا در کپی کردن';
                setTimeout(() => {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.disabled = false;
                }, 2500);
            }
        }

        window.onload = loadSubscriptionData;
    </script>
</body>
</html>
