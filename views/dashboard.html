  <!-- مودال پیشرفته ساخت کانفیگ با پروتکل‌های واقعی -->
  <div class="modal-wrap" id="createModal">
    <div class="modal-box">
      <h3 style="font-size: 15px; color:#38bdf8; margin-bottom: 14px;">ساخت کانفیگ جدید (On-First-Use)</h3>
      <form id="addForm">
        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">نام کاربر:</label>
        <input type="text" id="m-name" class="input-field" placeholder="مثال: گوشی شخصی" required>
        
        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">پروتکل و هسته اجرایی:</label>
        <select id="m-protocol" class="input-field" style="color: #38bdf8; font-weight: 700;">
          <option value="all">⚡ تمام پروتکل‌ها (پک کامل فول کانفیگ)</option>
          <option value="ws">🌐 WebSocket (VLESS / VMess / Trojan)</option>
          <option value="xhttp">🚀 XHTTP / SplitHTTP (هسته اختصاصی Xray)</option>
          <option value="reality">🛡️ VLESS REALITY (ضد فیلتر با Vision)</option>
          <option value="grpc">📶 gRPC (کم‌تاخیر و پرسرعت مخصوص گیم)</option>
          <option value="shadowsocks">🔑 Shadowsocks 2022 (AEAD سبک و سریع)</option>
          <option value="wireguard">🔒 WireGuard (تونل مستقیم UDP)</option>
        </select>

        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">سرور لوکیشن:</label>
        <select id="m-server" class="input-field">
          <option value="Germany (DE)">🇩🇪 Germany (DE)</option>
          <option value="Netherlands (NL)">🇳🇱 Netherlands (NL)</option>
          <option value="Turkey (TR)">🇹🇷 Turkey (TR)</option>
        </select>

        <div style="display: flex; gap: 8px;">
          <div style="flex: 1;">
            <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">حجم (GB):</label>
            <input type="number" id="m-gb" class="input-field" value="20" required>
          </div>
          <div style="flex: 1;">
            <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">اعتبار (روز):</label>
            <input type="number" id="m-days" class="input-field" value="30" required>
          </div>
        </div>

        <label style="font-size: 11px; color:#94a3b8; display:block; margin-bottom:4px;">محدودیت تعداد کاربر همزمان (IP Limit):</label>
        <input type="number" id="m-iplimit" class="input-field" value="2" required>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button type="submit" class="btn-main" style="flex:1; justify-content:center; padding: 11px;">تولید فوری</button>
          <button type="button" class="btn-main btn-del" style="padding: 11px;" onclick="closeModal()">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // رویداد ارسال فرم ساخت کانفیگ به همراه فیلد پروتکل
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/configs/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('m-name').value,
          server: document.getElementById('m-server').value,
          protocol: document.getElementById('m-protocol').value,
          total_gb: document.getElementById('m-gb').value,
          expire_days: document.getElementById('m-days').value,
          ip_limit: document.getElementById('m-iplimit').value
        })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.error);
      } else {
        closeModal();
        loadData();
      }
    });
  </script>
