<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ورود به پنل کاربری ONEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090e1a; color: #f8fafc; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-container {
      width: 100%; max-width: 900px; background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
      display: flex; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    .auth-info {
      flex: 1; padding: 48px 40px; background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-left: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; justify-content: space-between;
    }
    .auth-form-side { flex: 1.1; padding: 48px 40px; }
    .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: #38bdf8; }
    .feature-item { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: #94a3b8; }
    .feature-item i { color: #38bdf8; font-size: 16px; }
    
    .input-field {
      width: 100%; padding: 14px 16px; background: #090e1a; border: 1px solid #1e293b;
      border-radius: 12px; color: #fff; font-size: 14px; outline: none; margin-bottom: 14px;
    }
    .input-field:focus { border-color: #0284c7; }
    .btn-login {
      width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .btn-login:hover { background: #0369a1; }
    @media (max-width: 768px) {
      .auth-info { display: none; }
      .auth-container { max-width: 440px; }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-info">
      <div>
        <div class="brand-logo mb-4">
          <i class="fa-solid fa-cloud-bolt"></i>
          <span>ONEX</span>
        </div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 20px 0 10px;">به پنل کاربری ONEX خوش آمدید</h2>
        <p style="font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 30px;">دسترسی سریع، امن و پایدار به اینترنت آزاد و مدیریت یکپارچه اشتراک‌ها</p>
        
        <div class="feature-item"><i class="fa-solid fa-bolt"></i> اتصال پایدار و بدون قطعی</div>
        <div class="feature-item"><i class="fa-solid fa-gauge-high"></i> سرعت بالا و پینگ بهینه</div>
        <div class="feature-item"><i class="fa-solid fa-shield-halved"></i> امنیت کامل و رمزنگاری پیشرفته</div>
        <div class="feature-item"><i class="fa-solid fa-mobile-screen"></i> پشتیبانی از تمامی سیستم‌عامل‌ها</div>
      </div>
      <div style="font-size: 12px; color: #64748b;">
        سازنده: <span style="color: #38bdf8;">@Mehtif</span> | پشتیبانی: <a href="https://t.me/V2rayTunp" target="_blank" style="color: #38bdf8; text-decoration: none;">@V2rayTunp</a>
      </div>
    </div>

    <div class="auth-form-side">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h3 style="font-size: 18px; font-weight: 700;" id="formTitle">ورود به حساب</h3>
        <span style="font-size: 12px; color: #0284c7; cursor: pointer;" onclick="toggleAuth()" id="switchText">ثبت‌نام کاربر جدید</span>
      </div>

      <form id="loginForm">
        <input type="text" id="username" class="input-field" placeholder="نام کاربری یا ایمیل" required>
        <input type="password" id="password" class="input-field" placeholder="رمز عبور" required>
        <button type="submit" class="btn-login" id="submitBtn">ورود به پنل</button>
      </form>
    </div>
  </div>

  <script>
    let isRegister = false;
    function toggleAuth() {
      isRegister = !isRegister;
      document.getElementById('formTitle').innerText = isRegister ? 'ثبت‌نام کاربر جدید' : 'ورود به حساب';
      document.getElementById('switchText').innerText = isRegister ? 'ورود به حساب قبلی' : 'ثبت‌نام کاربر جدید';
      document.getElementById('submitBtn').innerText = isRegister ? 'ایجاد حساب کاربری' : 'ورود به پنل';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = isRegister ? '/api/register' : '/api/login';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
