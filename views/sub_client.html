<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اشتراک - NEXO</title>
    <!-- استایل‌های شیشه‌ای (Glassmorphism) -->
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        .status-box {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.5);
            font-size: 14px;
        }
        button {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="card">
        <h2>اشتراک NEXO</h2>
        <div id="loading-status" class="status-box">در حال بارگذاری اطلاعات اشتراک...</div>
        
        <button id="copy-btn" onclick="copyConfigs()" disabled>کپی کردن کانفیگ‌ها</button>
    </div>

    <script>
        // استخراج هوشمند شناسه اشتراک از آدرس URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const subId = pathSegments[pathSegments.length - 1];

        async function loadSubscriptionData() {
            const statusBox = document.getElementById('loading-status');
            const copyBtn = document.getElementById('copy-btn');

            if (!subId) {
                statusBox.innerText = 'خطا: شناسه اشتراک معتبر نیست.';
                statusBox.style.color = '#f87171';
                return;
            }

            try {
                // درخواست به مسیر JSON برای چک کردن وجود کانفیگ‌ها
                const response = await fetch(`/api/subscription/${subId}/json`);
                const result = await response.json();

                if (response.ok && result.success) {
                    statusBox.innerText = 'کانفیگ‌ها با موفقیت بارگذاری شدند و آماده استفاده هستند.';
                    statusBox.style.color = '#4ade80';
                    copyBtn.disabled = false;
                } else {
                    throw new Error(result.error || 'کانفیگ‌ها موجود نیستند');
                }
            } catch (error) {
                console.error('Error:', error);
                statusBox.innerText = 'خطا: کانفیگ‌ها موجود نیستند یا اشتراک معتبر نیست.';
                statusBox.style.color = '#f87171';
                copyBtn.disabled = true;
            }
        }

        async function copyConfigs() {
            const copyBtn = document.getElementById('copy-btn');
            const originalText = copyBtn.innerText;

            try {
                copyBtn.innerText = 'در حال بروز رسانی...';
                copyBtn.disabled = true;

                // دریافت محتوای نهایی ساب‌کریپشن (Base64) مستقیم از سرور
                const response = await fetch(`/sub/${subId}`);
                if (!response.ok) throw new Error('خطا در دریافت لینک اشتراک');
                
                const textContent = await response.text();

                // کپی کردن در کلیپ‌بورد
                await navigator.clipboard.writeText(textContent);

                copyBtn.innerText = 'با موفقیت کپی شد!';
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.disabled = false;
                }, 2000);

            } catch (err) {
                console.error('Failed to copy:', err);
                copyBtn.innerText = 'خطا در کپی کردن';
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.disabled = false;
                }, 2000);
            }
        }

        // اجرای تابع بارگذاری پس از لود کامل صفحه
        window.onload = loadSubscriptionData;
    </script>
</body>
</html>
