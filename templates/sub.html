<!-- Subscription & Config Actions -->
<div class="info-card fade-in fade-in-delay-3">
    <!-- Sub Link -->
    <div class="config-section">
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold small"><i class="fas fa-satellite-dish me-1" style="color: #818cf8;"></i> لینک اشتراک (Sub Link)</span>
            <small class="text-muted">جهت بروزرسانی خودکار</small>
        </div>
        <div class="config-text" id="subUrlText">{{ sub_link }}</div>
        <button class="btn-copy-main btn-copy-gradient" onclick="doCopy('{{ sub_link }}')">
            <i class="fas fa-copy"></i> کپی ساب لینک
        </button>
    </div>

    <!-- Single Direct Config -->
    <div class="config-section mt-3">
        <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold small"><i class="fas fa-key me-1" style="color: #06b6d4;"></i> کانفیگ مستقیم (Config)</span>
            <small class="text-muted">مستقیم {{ user.protocol|upper }}</small>
        </div>
        <div class="config-text" id="configUrlText">{{ config_link }}</div>
        <div class="d-flex gap-2">
            <button class="btn-copy-main btn-copy-outline" onclick="doCopy('{{ config_link }}')">
                <i class="fas fa-copy"></i> کپی کانفیگ
            </button>
        </div>
    </div>
</div>
